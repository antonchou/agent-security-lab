name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.16,<1"
      - name: Lint
        run: |
          python -m ruff --version
          python -m ruff check . --output-format github

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + integration tests
        run: pytest -q
      - name: CLI smoke (baseline poisoning + hardened rug pull)
        shell: bash
        run: |
          python -m agent_security_lab demo --profile baseline --scenario poisoning
          python -m agent_security_lab demo --profile hardened --scenario rug_pull

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit
      - name: Dependency audit
        run: pip-audit --skip-editable
